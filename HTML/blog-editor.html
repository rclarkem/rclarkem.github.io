<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Reina Mitchell</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;603&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">

    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <!-- Custom Blog CSS -->
    <link rel="stylesheet" href="../CSS/blog.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="blog-navbar">
        <div class="container">
            <div class="nav-left">
                <a href="../index.html" class="btn-home">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="blog.html" class="btn-new" style="background-color: transparent; color: #29f3c3; border-color: #29f3c3;">
                    <i class="fas fa-list"></i> All Posts
                </a>
            </div>
            <div class="social-links">
                <a href="https://github.com/rclarkem" target="_blank" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://www.linkedin.com/in/reina-mitchell/" target="_blank" title="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://medium.com/@rclarke-m" target="_blank" title="Medium">
                    <i class="fab fa-medium"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Editor Container -->
            <div class="editor-container">
                <div class="editor-header">
                    <h1>Add New Post</h1>
                </div>

                <!-- Title Input -->
                <input type="text" id="postTitle" class="title-input" placeholder="Post Title Here">

                <!-- Media Button -->
                <button class="btn-media" onclick="alert('Media upload would be handled through your image hosting service. Add image URLs directly in the editor.')">
                    <i class="fas fa-camera"></i> Add Media
                </button>

                <!-- Quill Editor -->
                <div id="editor">
                    <p>Write your blog post content here...</p>
                </div>

                <!-- Editor Actions -->
                <div class="editor-actions">
                    <button class="btn-cancel" onclick="cancelEdit()">
                        Cancel
                    </button>
                    <button class="btn-save" onclick="saveBlogPost()">
                        <i class="fas fa-save"></i> Save Post
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Save Modal -->
    <div id="saveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Save Post</h2>
            </div>
            <div class="modal-body">
                <div id="saveInstructions">
                    <!-- Instructions will be inserted here -->
                </div>
                <div class="json-output" id="jsonOutput">
                    <!-- JSON will be displayed here -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-copy" onclick="copyJSON()">
                    <i class="fas fa-copy"></i> Copy JSON
                </button>
                <button class="btn-close-modal" onclick="closeModal('saveModal')">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

    <!-- Quill.js -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <!-- Custom Blog JS -->
    <script src="../JS/blog.js"></script>

    <script>
        // Initialize Quill editor
        var quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'align': [] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image'],
                    ['clean']
                ]
            },
            placeholder: 'Write your blog post content here...'
        });

        // Make quill available globally
        window.quill = quill;

        // Initialize editor (load post if editing)
        $(document).ready(function() {
            checkEditorAccess();
            initializeBlogEditor();
        });

        // Handle keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + S to save
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveBlogPost();
            }
        });
    </script>
</body>
</html>
