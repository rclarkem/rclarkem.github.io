<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post - Reina Mitchell</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;603&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">

    <!-- Custom Blog CSS -->
    <link rel="stylesheet" href="../CSS/blog.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="blog-navbar">
        <div class="container">
            <div class="nav-left">
                <a href="../index.html" class="btn-home">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="blog-editor.html" class="btn-new admin-only">
                    <i class="fas fa-plus"></i> New
                </a>
            </div>
            <div class="social-links">
                <a href="https://github.com/rclarkem" target="_blank" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://www.linkedin.com/in/reina-mitchell/" target="_blank" title="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://medium.com/@rclarke-m" target="_blank" title="Medium">
                    <i class="fab fa-medium"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Post Header -->
            <div class="post-header">
                <h1 id="postTitle" class="post-title">Loading...</h1>
                <div class="post-meta">
                    <span id="postDate"></span>
                </div>
                <div class="post-actions admin-only">
                    <button id="editBtn" class="btn-edit">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button id="deleteBtn" class="btn-delete">
                        <i class="fas fa-trash-alt"></i> Delete
                    </button>
                </div>
            </div>

            <!-- Post Content -->
            <div id="postContent" class="post-content">
                <!-- Post content will be loaded here -->
            </div>

            <!-- Back Link -->
            <a href="blog.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Blog
            </a>
        </div>
    </main>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Delete Post</h2>
            </div>
            <div id="deleteInstructions" class="modal-body">
                <!-- Instructions will be inserted here -->
            </div>
            <div class="modal-footer">
                <button class="btn-close-modal" onclick="closeModal('deleteModal')">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

    <!-- Custom Blog JS -->
    <script src="../JS/blog.js"></script>

    <script>
        // Load and display the blog post
        $(document).ready(function() {
            initAuth();
            loadSinglePost();
        });
    </script>
</body>
</html>
